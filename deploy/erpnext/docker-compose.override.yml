# This override is used together with the official frappe_docker compose files.
# It adds no public ERPNext port; only Door ERP's existing Nginx can reach it.
services:
  frontend:
    networks:
      default: {}
      erp_gateway:
        aliases:
          - erpnext-frontend

networks:
  erp_gateway:
    name: erp-gateway
    external: true
