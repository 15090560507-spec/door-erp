server {
    # Temporary public ERPNext entry. Door ERP continues to use 443.
    # Keep Frappe's created site name on the upstream Host header.
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/door-erp.crt;
    ssl_certificate_key /etc/nginx/certs/door-erp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $erpnext_upstream http://erpnext-frontend:8080;

    location / {
        proxy_pass $erpnext_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host erp.124.223.87.161.nip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
